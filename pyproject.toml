[project]
name = "rl-map-manager"
version = "1.0.0"
description = "Browse and install Rocket League workshop maps into the BakkesMod Workshop Map Loader CustomMaps folder."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Killian Miller" }]
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/KillianM00/rl-map-manager"
Issues = "https://github.com/KillianM00/rl-map-manager/issues"

[project.scripts]
rlmm = "rlmm:main"
